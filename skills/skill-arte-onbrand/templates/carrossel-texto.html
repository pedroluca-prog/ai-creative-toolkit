<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{googleFontsLink}}
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: {{fontBody}};
    background-color: {{bgDeep}};
    color: #fff;
    padding: 96px 80px 120px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    position: relative;
    overflow: hidden;
  }
  .bg-gradient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 12% 15%, rgba({{accentRgb}},0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 55% at 90% 92%, rgba({{accentRgb}},0.10) 0%, transparent 55%);
    z-index: 0;
    pointer-events: none;
  }
  .bg-pattern {
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 48 48'><path d='M24 4 L24 14 M24 34 L24 44 M4 24 L14 24 M34 24 L44 24' stroke='%23{{accentHex}}' stroke-width='0.8' stroke-linecap='round' opacity='0.6'/><circle cx='24' cy='24' r='0.9' fill='%23{{accentHex}}' opacity='0.5'/></svg>");
    background-size: 48px 48px;
    opacity: 0.12;
    z-index: 1;
    pointer-events: none;
  }
  .bg-vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.35) 100%);
    z-index: 2;
    pointer-events: none;
  }
  .bg-symbol {
    position: absolute;
    right: -50px;
    top: -40px;
    width: 320px;
    height: 320px;
    background-image: url("{{logoSymbolPath}}");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0.28;
    z-index: 1;
    pointer-events: none;
    transform: rotate(15deg);
    filter: brightness(1.35);
  }
  .eyebrow, .title, .body, .highlight, .footer {
    position: relative;
    z-index: 3;
  }
  .eyebrow {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: {{accentLight}};
  }
  .title {
    font-family: {{fontDisplay}};
    font-size: 70px;
    line-height: 1.05;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    color: #fff;
  }
  .body {
    font-size: 34px;
    font-weight: 300;
    line-height: 1.35;
    color: rgba(255,255,255,0.92);
    max-width: 900px;
  }
  .body p + p { margin-top: 20px; }
  .body strong {
    color: {{accentLight}};
    font-weight: 500;
  }
  .highlight {
    font-family: {{fontData}};
    font-size: 58px;
    line-height: 1.1;
    color: #fff;
    border-left: 6px solid {{accent}};
    padding-left: 28px;
    margin-top: 12px;
  }
  .footer {
    position: absolute;
    left: 80px;
    right: 80px;
    bottom: 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .handle {
    font-size: 18px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1px;
  }
  .page-num {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.7);
  }
  .logo {
    height: 60px;
    opacity: 0.95;
  }
</style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-symbol"></div>
  <div class="bg-pattern"></div>
  <div class="bg-vignette"></div>
  <div class="eyebrow">{{eyebrow}}</div>
  <div class="title">{{title}}</div>
  <div class="body">{{bodyHtml}}</div>
  <div class="highlight">{{highlight}}</div>
  <div class="footer">
    <div class="handle">{{handle}}</div>
    <div class="page-num">{{pageNum}} / {{pageTotal}}</div>
    <img class="logo" src="{{logoPath}}" alt="">
  </div>
</body>
</html>

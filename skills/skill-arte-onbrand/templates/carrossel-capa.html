<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{googleFontsLink}}
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: {{fontBody}};
    background: {{bgDeep}};
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .bg {
    position: absolute;
    inset: 0;
    background-color: {{bgDark}};
    background-image: url("{{backgroundImage}}");
    background-size: cover;
    background-position: center;
  }
  .bg-fallback-pattern {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(71,166,19,0.25) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(71,166,19,0.18) 0%, transparent 40%);
    pointer-events: none;
  }
  .scrim {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(2,67,27,0.25) 0%, rgba(2,67,27,0.25) 50%, rgba(2,67,27,0.92) 100%);
  }
  .band {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 80px 70px 70px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .eyebrow {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: {{accentLight}};
  }
  .headline {
    font-family: {{fontDisplay}};
    font-size: 92px;
    line-height: 1.02;
    letter-spacing: -1px;
    max-width: 900px;
  }
  .subhead {
    font-size: 30px;
    font-weight: 400;
    line-height: 1.3;
    color: rgba(255,255,255,0.92);
    max-width: 820px;
  }
  .footer {
    position: absolute;
    top: 50px;
    right: 60px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .page-num {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 2px;
    padding: 10px 18px;
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="bg-fallback-pattern"></div>
  <div class="scrim"></div>
  <div class="footer">
    <div class="page-num">{{pageNum}} / {{pageTotal}}</div>
  </div>
  <div class="band">
    <div class="eyebrow">{{eyebrow}}</div>
    <div class="headline">{{headlineHtml}}{{headline}}</div>
    <div class="subhead">{{subhead}}</div>
  </div>
</body>
</html>

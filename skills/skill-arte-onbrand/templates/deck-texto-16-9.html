<!DOCTYPE html>
<!--
  deck-texto-16-9 (1920x1080)
  Slide com texto + body sem foto. Fundo gradient + símbolo capim + vinheta.
  Layout: eyebrow + title à esquerda, body à direita; opcional highlight/destaque embaixo.
  Props:
    - eyebrow: linha pequena uppercase
    - title: headline Bree Serif
    - subhead: subtítulo Poppins (opcional)
    - paragraphs[] OU bodyHtml: corpo de texto
    - highlight: pull-quote/destaque opcional (Bree Serif italic)
    - footnote: rodapé pequeno opcional (Poppins regular)
    - handle: rodapé esquerda
    - pageNum/pageTotal: numeração opcional canto direito
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{googleFontsLink}}
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: {{fontBody}};
    background-color: {{bgDeep}};
    color: #fff;
    padding: 80px 80px 110px;
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: 5fr 6fr;
    grid-template-rows: auto 1fr auto;
    column-gap: 70px;
    row-gap: 24px;
  }
  .bg-gradient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 70% at 8% 18%, rgba(71,166,19,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 92% 88%, rgba(71,166,19,0.10) 0%, transparent 55%);
    z-index: 0;
    pointer-events: none;
  }
  .bg-pattern {
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 48 48'><path d='M24 4 L24 14 M24 34 L24 44 M4 24 L14 24 M34 24 L44 24' stroke='%2347a613' stroke-width='0.8' stroke-linecap='round' opacity='0.6'/><circle cx='24' cy='24' r='0.9' fill='%2347a613' opacity='0.5'/></svg>");
    background-size: 48px 48px;
    opacity: 0.10;
    z-index: 1;
    pointer-events: none;
  }
  .bg-vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.32) 100%);
    z-index: 2;
    pointer-events: none;
  }
  .bg-symbol {
    position: absolute;
    right: -60px;
    top: -50px;
    width: 380px;
    height: 380px;
    background-image: url("{{logoSymbolPath}}");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0.22;
    z-index: 1;
    pointer-events: none;
    transform: rotate(15deg);
    filter: brightness(1.35);
  }
  .header, .col-left, .col-right, .footer {
    position: relative;
    z-index: 3;
  }
  .header {
    grid-column: 1 / span 2;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .eyebrow {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: {{accentLight}};
  }
  .pageinfo {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.65);
    text-transform: uppercase;
  }
  .col-left { display: flex; flex-direction: column; gap: 28px; }
  .col-right { display: flex; flex-direction: column; gap: 22px; }
  .title {
    font-family: {{fontDisplay}};
    font-size: 64px;
    line-height: 1.04;
    letter-spacing: -0.5px;
    color: #fff;
  }
  .subhead {
    font-size: 22px;
    font-weight: 400;
    line-height: 1.35;
    color: rgba(255,255,255,0.85);
  }
  .body {
    font-size: 24px;
    font-weight: 300;
    line-height: 1.4;
    color: rgba(255,255,255,0.92);
  }
  .body p + p { margin-top: 14px; }
  .body strong {
    color: {{accentLight}};
    font-weight: 500;
  }
  .body ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .body ul li {
    position: relative;
    padding-left: 28px;
    margin-bottom: 14px;
  }
  .body ul li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 14px;
    width: 12px;
    height: 12px;
    background: {{accent}};
    border-radius: 50%;
  }
  .highlight {
    font-family: {{fontDisplay}};
    font-style: italic;
    font-size: 32px;
    line-height: 1.2;
    color: #fff;
    background: rgba(71,166,19,0.18);
    border-left: 5px solid {{accent}};
    padding: 18px 24px;
    margin-top: 8px;
  }
  .footnote {
    font-size: 14px;
    line-height: 1.4;
    color: rgba(255,255,255,0.62);
    max-width: 100%;
  }
  .footer {
    grid-column: 1 / span 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.12);
    font-size: 14px;
    color: rgba(255,255,255,0.62);
    letter-spacing: 1px;
  }
  .footer .logo {
    height: 50px;
    opacity: 0.92;
  }
  .footer .left {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .badge-provisorio {
    position: absolute;
    top: 18px;
    right: 80px;
    background: #c75c2c;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 4px;
    z-index: 5;
    display: {{provisorioDisplay}};
  }
</style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-symbol"></div>
  <div class="bg-pattern"></div>
  <div class="bg-vignette"></div>
  <div class="badge-provisorio">{{provisorioLabel}}</div>
  <div class="header">
    <div class="eyebrow">{{eyebrow}}</div>
    <div class="pageinfo">{{pageInfo}}</div>
  </div>
  <div class="col-left">
    <div class="title">{{title}}</div>
    <div class="subhead">{{subhead}}</div>
    <div class="highlight">{{highlight}}</div>
  </div>
  <div class="col-right">
    <div class="body">{{bodyHtml}}</div>
    <div class="footnote">{{footnote}}</div>
  </div>
  <div class="footer">
    <div class="left">
      <img class="logo" src="{{logoPath}}" alt="">
      <span>{{handle}}</span>
    </div>
    <div>{{footerRight}}</div>
  </div>
</body>
</html>

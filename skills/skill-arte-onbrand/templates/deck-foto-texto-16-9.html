<!DOCTYPE html>
<!--
  deck-foto-texto-16-9 (1920x1080)
  Slide com foto à esquerda (45%) + texto à direita (55%) com gradient de transição.
  Layout horizontal — para landscape 16:9.
  Props:
    - eyebrow: linha pequena uppercase
    - title: headline Bree Serif
    - subhead: subtítulo Poppins (opcional)
    - paragraphs[] OU bodyHtml: corpo
    - highlight: pull-quote/destaque opcional
    - footnote: rodapé pequeno
    - handle: rodapé esquerda
    - backgroundImage: foto obrigatória à esquerda
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{googleFontsLink}}
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: {{fontBody}};
    background-color: {{bgDeep}};
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .photo {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 45%;
    background-image: url("{{backgroundImage}}");
    background-size: cover;
    background-position: center;
    z-index: 0;
  }
  .photo-fade {
    position: absolute;
    top: 0;
    bottom: 0;
    left: calc(45% - 80px);
    width: 80px;
    background: linear-gradient(90deg, rgba(2,67,27,0) 0%, rgba(2,67,27,0.7) 60%, {{bgDeep}} 100%);
    z-index: 1;
    pointer-events: none;
  }
  .text-panel {
    position: absolute;
    top: 0;
    bottom: 0;
    right: 0;
    width: 55%;
    background-color: {{bgDeep}};
    padding: 80px 80px 100px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    z-index: 2;
    overflow: hidden;
  }
  .panel-gradient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 15% 20%, rgba(71,166,19,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 55% at 90% 95%, rgba(71,166,19,0.10) 0%, transparent 55%);
    z-index: 0;
    pointer-events: none;
  }
  .panel-symbol {
    position: absolute;
    right: -60px;
    top: -50px;
    width: 320px;
    height: 320px;
    background-image: url("{{logoSymbolPath}}");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0.20;
    z-index: 1;
    pointer-events: none;
    transform: rotate(15deg);
    filter: brightness(1.35);
  }
  .eyebrow, .title, .body, .highlight, .footnote, .footer-content, .quote-block, .pills {
    position: relative;
    z-index: 3;
  }
  .eyebrow {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: {{accentLight}};
  }
  .title {
    font-family: {{fontDisplay}};
    font-size: 50px;
    line-height: 1.06;
    letter-spacing: -0.5px;
    color: #fff;
  }
  .subhead {
    font-size: 22px;
    font-weight: 400;
    line-height: 1.35;
    color: rgba(255,255,255,0.85);
  }
  .body {
    font-size: 22px;
    font-weight: 300;
    line-height: 1.4;
    color: rgba(255,255,255,0.92);
  }
  .body p + p { margin-top: 12px; }
  .body strong {
    color: {{accentLight}};
    font-weight: 500;
  }
  .body ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .body ul li {
    position: relative;
    padding-left: 28px;
    margin-bottom: 12px;
  }
  .body ul li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 11px;
    width: 11px;
    height: 11px;
    background: {{accent}};
    border-radius: 50%;
  }
  .quote-block {
    font-family: {{fontDisplay}};
    font-style: italic;
    font-size: 26px;
    line-height: 1.25;
    color: #fff;
    background: rgba(71,166,19,0.18);
    border-left: 5px solid {{accent}};
    padding: 18px 24px;
    margin-top: 4px;
  }
  .attribution {
    font-size: 16px;
    color: rgba(255,255,255,0.78);
    margin-top: -8px;
    padding-left: 4px;
    border-left: 2px solid {{accent}};
    padding-left: 14px;
  }
  .pills {
    display: flex;
    gap: 24px;
    margin-top: 8px;
  }
  .pill {
    flex: 1;
    text-align: left;
  }
  .pill .num {
    font-family: {{fontDisplay}};
    font-size: 38px;
    line-height: 1.0;
    color: {{accentLight}};
    margin-bottom: 4px;
  }
  .pill .label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.78);
    line-height: 1.3;
  }
  .highlight {
    font-family: {{fontDisplay}};
    font-style: italic;
    font-size: 28px;
    line-height: 1.2;
    color: #fff;
    background: rgba(71,166,19,0.20);
    border-left: 5px solid {{accent}};
    padding: 16px 22px;
  }
  .footnote {
    font-size: 13px;
    line-height: 1.4;
    color: rgba(255,255,255,0.60);
  }
  .footer-content {
    position: absolute;
    left: 80px;
    right: 80px;
    bottom: 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 4;
    font-size: 14px;
    color: rgba(255,255,255,0.65);
    letter-spacing: 1px;
  }
  .footer-content .logo {
    height: 50px;
    opacity: 0.95;
  }
  .footer-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .badge-provisorio {
    position: absolute;
    top: 18px;
    right: 24px;
    background: #c75c2c;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 4px;
    z-index: 5;
    display: {{provisorioDisplay}};
  }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="photo-fade"></div>
  <div class="text-panel">
    <div class="panel-gradient"></div>
    <div class="panel-symbol"></div>
    <div class="badge-provisorio">{{provisorioLabel}}</div>
    <div class="eyebrow">{{eyebrow}}</div>
    <div class="title">{{title}}</div>
    <div class="subhead">{{subhead}}</div>
    <div class="quote-block">{{quote}}</div>
    <div class="attribution">{{attribution}}</div>
    <div class="body">{{bodyHtml}}</div>
    <div class="pills">{{pillsHtml}}</div>
    <div class="highlight">{{highlight}}</div>
    <div class="footnote">{{footnote}}</div>
  </div>
  <div class="footer-content">
    <div class="footer-left">
      <img class="logo" src="{{logoPath}}" alt="">
      <span>{{handle}}</span>
    </div>
    <div>{{footerRight}}</div>
  </div>
</body>
</html>

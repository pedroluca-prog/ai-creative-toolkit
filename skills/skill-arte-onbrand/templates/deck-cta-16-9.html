<!DOCTYPE html>
<!--
  deck-cta-16-9 (1920x1080)
  Slide de fechamento com CTA ou contato. Layout: 2 colunas — esquerda texto/CTA, direita opcional foto/quote.
  Props:
    - eyebrow
    - title
    - subhead
    - actions[]: array de {label, value, prazo} para 3 passos numerados
    - contacts[]: array de {label, value} para canais (Glauco WA, Lourenço WA, IG, site, MF Cast)
    - quote: testimonial à direita (opcional)
    - quoteAttribution: atribuição do quote
    - slotReservado: bool — desenha placeholder de vídeo 16:9 onde quote estaria
    - footnote: rodapé pequeno
    - handle
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{googleFontsLink}}
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: {{fontBody}};
    background-color: {{bgDeep}};
    color: #fff;
    padding: 70px 80px 100px;
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr auto;
    column-gap: 60px;
    row-gap: 22px;
  }
  .bg-gradient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 12% 15%, rgba(71,166,19,0.20) 0%, transparent 60%),
      radial-gradient(ellipse 60% 55% at 90% 92%, rgba(71,166,19,0.10) 0%, transparent 55%);
    z-index: 0;
    pointer-events: none;
  }
  .bg-symbol {
    position: absolute;
    right: -60px;
    top: -50px;
    width: 380px;
    height: 380px;
    background-image: url("{{logoSymbolPath}}");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0.18;
    z-index: 1;
    pointer-events: none;
    transform: rotate(15deg);
    filter: brightness(1.35);
  }
  .bg-pattern {
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 48 48'><path d='M24 4 L24 14 M24 34 L24 44 M4 24 L14 24 M34 24 L44 24' stroke='%2347a613' stroke-width='0.8' stroke-linecap='round' opacity='0.6'/><circle cx='24' cy='24' r='0.9' fill='%2347a613' opacity='0.5'/></svg>");
    background-size: 48px 48px;
    opacity: 0.10;
    z-index: 1;
    pointer-events: none;
  }
  .bg-vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.30) 100%);
    z-index: 2;
    pointer-events: none;
  }
  .header, .col-left, .col-right, .footer-row {
    position: relative;
    z-index: 3;
  }
  .header {
    grid-column: 1 / span 2;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .eyebrow {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: {{accentLight}};
  }
  .pageinfo {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.65);
    text-transform: uppercase;
  }
  .title {
    font-family: {{fontDisplay}};
    font-size: 56px;
    line-height: 1.05;
    letter-spacing: -0.5px;
    color: #fff;
    margin-top: 6px;
  }
  .subhead {
    font-size: 22px;
    font-weight: 400;
    line-height: 1.32;
    color: rgba(255,255,255,0.85);
    margin-top: 10px;
    max-width: 1300px;
  }
  .col-left {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .actions-list {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .action {
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 18px;
    align-items: start;
    padding-bottom: 14px;
    border-bottom: 1px dashed rgba(255,255,255,0.18);
  }
  .action:last-child { border-bottom: none; }
  .action .num {
    font-family: {{fontDisplay}};
    font-size: 38px;
    line-height: 1;
    color: {{accentLight}};
    grid-row: 1 / span 2;
    align-self: start;
  }
  .action .label {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
    line-height: 1.3;
  }
  .action .label strong {
    color: {{accentLight}};
  }
  .action .prazo {
    font-size: 14px;
    color: rgba(255,255,255,0.65);
    margin-top: 4px;
    line-height: 1.3;
    font-weight: 400;
  }
  .col-right {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .quote-block {
    background: rgba(71,166,19,0.12);
    border-left: 4px solid {{accent}};
    padding: 22px 28px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .quote-block .quote {
    font-family: {{fontDisplay}};
    font-style: italic;
    font-size: 24px;
    line-height: 1.3;
    color: #fff;
  }
  .quote-block .attribution {
    font-size: 14px;
    color: rgba(255,255,255,0.7);
    margin-top: 14px;
    letter-spacing: 0.4px;
  }
  .video-slot {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: rgba(0,0,0,0.4);
    border: 2px dashed rgba(255,255,255,0.45);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 24px;
    text-align: center;
  }
  .video-slot .icon {
    font-size: 38px;
    color: {{accentLight}};
  }
  .video-slot .label {
    font-size: 14px;
    color: rgba(255,255,255,0.85);
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .video-slot .desc {
    font-size: 12px;
    color: rgba(255,255,255,0.6);
    line-height: 1.4;
  }
  .contacts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px 22px;
    margin-top: 8px;
  }
  .contact-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .contact-item .clabel {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: {{accentLight}};
  }
  .contact-item .cvalue {
    font-size: 16px;
    color: #fff;
    font-weight: 500;
    word-break: break-all;
  }
  .contact-item .cvalue.editable {
    background: #FFF8DC;
    color: #1B1F14;
    border: 2px dashed {{amber}};
    padding: 4px 10px;
    border-radius: 6px;
    display: inline-block;
    font-weight: 500;
    width: fit-content;
  }
  .footer-row {
    grid-column: 1 / span 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.12);
    font-size: 14px;
    color: rgba(255,255,255,0.62);
    letter-spacing: 1px;
  }
  .footer-row .logo {
    height: 50px;
    opacity: 0.92;
  }
  .footer-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .footnote {
    font-size: 13px;
    line-height: 1.4;
    color: rgba(255,255,255,0.55);
    max-width: 700px;
    margin-top: 4px;
  }
  .badge-provisorio {
    position: absolute;
    top: 18px;
    right: 24px;
    background: #c75c2c;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 4px;
    z-index: 5;
    display: {{provisorioDisplay}};
  }
</style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-symbol"></div>
  <div class="bg-pattern"></div>
  <div class="bg-vignette"></div>
  <div class="badge-provisorio">{{provisorioLabel}}</div>
  <div class="header">
    <div>
      <div class="eyebrow">{{eyebrow}}</div>
      <div class="title">{{title}}</div>
      <div class="subhead">{{subhead}}</div>
    </div>
    <div class="pageinfo">{{pageInfo}}</div>
  </div>
  <div class="col-left">
    <div class="actions-list">{{actionsHtml}}</div>
    <div class="contacts">{{contactsHtml}}</div>
    <div class="footnote">{{footnote}}</div>
  </div>
  <div class="col-right">{{rightSideHtml}}</div>
  <div class="footer-row">
    <div class="footer-left">
      <img class="logo" src="{{logoPath}}" alt="">
      <span>{{handle}}</span>
    </div>
    <div>{{footerRight}}</div>
  </div>
</body>
</html>

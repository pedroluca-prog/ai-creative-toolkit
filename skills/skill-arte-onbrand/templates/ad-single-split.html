<!DOCTYPE html>
<!--
  Template: ad-single-split (L2)
  Use: Anuncio single image remarketing — grid 60/40 (numero/texto esquerda, foto direita)
       Em formato story (9:16, 1080x1920): automaticamente muda para layout coluna
       (texto acima + foto no terco inferior) via media query.
  Props:
    eyebrow         — rotulo pequeno acima do hero (ex: "PACOTE COMPLETO")
    hero            — numero ou frase grande em Bree Serif (ex: "R$ 8.180/ha")
    heroSub         — linha abaixo do hero (ex: "por 15 anos") — deixar vazio para ocultar
    strikethroughHtml — HTML RAW da lista riscada (Cost Stack) — deixar vazio para ocultar
    objection       — linha de objection handling
    proof           — linha de prova social — deixar vazio para ocultar
    handle          — @handle no rodape
  RAW fields: strikethroughHtml
  backgroundImage: path da foto no nivel root do job (nao em props)
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{googleFontsLink}}
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }

  body {
    font-family: {{fontBody}};
    background: {{bgDeep}};
    color: #ffffff;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }

  /* Borda fina on-brand */
  .frame {
    position: absolute;
    inset: 36px;
    border: 1.5px solid rgba(255,255,255,0.18);
    pointer-events: none;
    z-index: 10;
  }

  /* ──────────────────────────────────────────────
     LAYOUT 1:1 — lado a lado (row)
  ────────────────────────────────────────────── */

  /* Coluna esquerda 60% — texto */
  .left-col {
    flex: 0 0 60%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 72px 48px 120px 72px;
    position: relative;
    z-index: 2;
  }

  /* Coluna direita 40% — foto */
  .right-col {
    flex: 0 0 40%;
    position: relative;
    overflow: hidden;
  }

  .right-col .photo {
    position: absolute;
    inset: 0;
    background-image: url("{{backgroundImage}}");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
  }

  /* Scrim esquerdo na foto — integra com fundo verde escuro */
  .right-col .photo::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to right,
      {{bgDeep}} 0%,
      rgba(2,67,27,0.45) 30%,
      rgba(2,67,27,0.08) 100%
    );
  }

  /* Scrim inferior na foto — espaco para logo */
  .right-col .photo::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 130px;
    background: linear-gradient(
      to top,
      rgba(2,67,27,0.88) 0%,
      rgba(2,67,27,0) 100%
    );
  }

  /* ──────────────────────────────────────────────
     LAYOUT 9:16 — coluna (story)
     Foto em baixo, texto acima
  ────────────────────────────────────────────── */
  @media (min-height: 1500px) {
    body {
      flex-direction: column;
    }

    .left-col {
      flex: 0 0 68%;
      padding: 90px 80px 32px 80px;
      align-items: flex-start;
      justify-content: center;
    }

    .right-col {
      flex: 0 0 32%;
    }

    /* No story, o scrim da foto vai de cima pra baixo */
    .right-col .photo::before {
      background: linear-gradient(
        to bottom,
        {{bgDeep}} 0%,
        rgba(2,67,27,0.55) 35%,
        rgba(2,67,27,0.18) 100%
      );
    }

    /* Scrim de baixo mais suave (logo fica no footer absoluto) */
    .right-col .photo::after {
      height: 90px;
      background: linear-gradient(
        to top,
        rgba(2,67,27,0.75) 0%,
        rgba(2,67,27,0) 100%
      );
    }

    .hero {
      font-size: 140px !important;
    }

    .objection {
      max-width: 840px;
    }
  }

  /* ──────────────────────────────────────────────
     TIPOGRAFIA E ELEMENTOS
  ────────────────────────────────────────────── */

  /* Eyebrow */
  .eyebrow {
    font-family: {{fontBody}};
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: {{accentLight}};
    margin-bottom: 16px;
  }

  /* Lista riscada (Cost Stack) */
  .strikethrough-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 16px;
  }
  .strikethrough-row span {
    font-family: {{fontBody}};
    font-size: 20px;
    font-weight: 400;
    color: rgba(255,255,255,0.55);
    text-decoration: line-through;
    text-decoration-color: rgba(71,166,19,0.8);
    text-decoration-thickness: 2px;
  }

  /* Hero number/text — Bree Serif grande */
  .hero {
    font-family: {{fontDisplay}};
    font-size: 118px;
    line-height: 1.0;
    letter-spacing: -3px;
    color: #ffffff;
    word-break: break-word;
  }

  .hero-sub {
    font-family: {{fontBody}};
    font-size: 32px;
    font-weight: 300;
    color: {{accentLight}};
    margin-top: 8px;
    letter-spacing: 1px;
  }

  /* Linha separadora */
  .divider {
    width: 48px;
    height: 2px;
    background: {{accent}};
    margin: 22px 0 18px 0;
    opacity: 0.7;
  }

  /* Objection handling */
  .objection {
    font-family: {{fontBody}};
    font-size: 24px;
    font-weight: 400;
    color: rgba(255,255,255,0.88);
    line-height: 1.4;
    max-width: 480px;
  }

  /* Prova social */
  .proof {
    font-family: {{fontBody}};
    font-size: 20px;
    font-weight: 600;
    color: {{accentLight}};
    margin-top: 14px;
    letter-spacing: 1px;
  }

  /* Footer — posicionado absolutamente na base */
  .footer {
    position: absolute;
    left: 60px;
    right: 52px;
    bottom: 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 5;
  }

  .handle {
    font-family: {{fontBody}};
    font-size: 18px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.7);
  }

  .logo {
    height: 60px;
    width: auto;
    object-fit: contain;
    opacity: 0.95;
  }
</style>
</head>
<body>
  <div class="frame"></div>

  <!-- Coluna esquerda/superior: texto -->
  <div class="left-col">
    <div class="eyebrow">{{eyebrow}}</div>
    {{strikethroughHtml}}
    <div class="hero">{{hero}}</div>
    <div class="hero-sub">{{heroSub}}</div>
    <div class="divider"></div>
    <div class="objection">{{objection}}</div>
    <div class="proof">{{proof}}</div>
  </div>

  <!-- Coluna direita/inferior: foto -->
  <div class="right-col">
    <div class="photo"></div>
  </div>

  <!-- Footer sobreposto -->
  <div class="footer">
    <div class="handle">{{handle}}</div>
    <img class="logo" src="{{logoPath}}" alt="">
  </div>
</body>
</html>

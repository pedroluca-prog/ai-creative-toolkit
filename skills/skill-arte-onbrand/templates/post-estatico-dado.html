<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{googleFontsLink}}
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: {{fontBody}};
    background: {{bgDeep}};
    color: #ffffff;
    position: relative;
    padding: 80px 70px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: stretch;
    overflow: hidden;
  }
  .frame {
    position: absolute;
    inset: 36px;
    border: 1.5px solid rgba(255,255,255,0.22);
    pointer-events: none;
  }
  .eyebrow {
    font-family: {{fontBody}};
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: {{accentLight}};
    margin-bottom: 28px;
  }
  .title {
    font-family: {{fontBody}};
    font-size: 46px;
    font-weight: 300;
    line-height: 1.15;
    color: rgba(255,255,255,0.92);
    margin-bottom: 32px;
    max-width: 780px;
  }
  .highlight {
    font-family: {{fontData}};
    font-size: 172px;
    line-height: 1.02;
    letter-spacing: -2px;
    color: #ffffff;
    margin-bottom: 36px;
  }
  .subtitle {
    font-family: {{fontBody}};
    font-size: 34px;
    font-weight: 400;
    line-height: 1.25;
    color: rgba(255,255,255,0.88);
    max-width: 780px;
  }
  .footer {
    position: absolute;
    left: 70px;
    right: 70px;
    bottom: 66px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .handle {
    font-family: {{fontBody}};
    font-size: 20px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.7);
  }
  .logo {
    height: 72px;
    width: auto;
    object-fit: contain;
    opacity: 0.95;
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="eyebrow">{{eyebrow}}</div>
  <div class="title">{{title}}</div>
  <div class="highlight">{{highlight}}</div>
  <div class="subtitle">{{subtitle}}</div>
  <div class="footer">
    <div class="handle">{{handle}}</div>
    <img class="logo" src="{{logoPath}}" alt="">
  </div>
</body>
</html>

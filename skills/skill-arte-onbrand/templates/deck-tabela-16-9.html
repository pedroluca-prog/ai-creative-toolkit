<!DOCTYPE html>
<!--
  deck-tabela-16-9 (1920x1080)
  Slide com tabela comparativa multi-coluna (2-3 colunas) para slides como S1, S3, slide 2, slide 3.
  Layout: title topo, tabela ocupando o corpo principal, footnote em baixo.
  Props:
    - eyebrow
    - title
    - subhead (opcional)
    - colHeaders[]: array de strings (cabeçalhos das colunas — primeira é "Dimensão" geralmente)
    - rows[]: array de arrays de strings (matriz de células — alinha com colHeaders)
    - emphasizeLastRow: bool — destaca última linha em verde claro
    - footnote: rodapé (frase-âncora ou disclaimer)
    - handle
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{googleFontsLink}}
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: {{fontBody}};
    background-color: {{bgDeep}};
    color: #fff;
    padding: 70px 80px 100px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .bg-gradient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 12% 15%, rgba(71,166,19,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 55% at 90% 92%, rgba(71,166,19,0.10) 0%, transparent 55%);
    z-index: 0;
    pointer-events: none;
  }
  .bg-symbol {
    position: absolute;
    right: -60px;
    top: -50px;
    width: 320px;
    height: 320px;
    background-image: url("{{logoSymbolPath}}");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0.18;
    z-index: 1;
    pointer-events: none;
    transform: rotate(15deg);
    filter: brightness(1.35);
  }
  .bg-pattern {
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 48 48'><path d='M24 4 L24 14 M24 34 L24 44 M4 24 L14 24 M34 24 L44 24' stroke='%2347a613' stroke-width='0.8' stroke-linecap='round' opacity='0.6'/><circle cx='24' cy='24' r='0.9' fill='%2347a613' opacity='0.5'/></svg>");
    background-size: 48px 48px;
    opacity: 0.10;
    z-index: 1;
    pointer-events: none;
  }
  .bg-vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.30) 100%);
    z-index: 2;
    pointer-events: none;
  }
  .header, .table-wrap, .footnote-block, .footer-row {
    position: relative;
    z-index: 3;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .eyebrow {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: {{accentLight}};
  }
  .pageinfo {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.65);
    text-transform: uppercase;
  }
  .title {
    font-family: {{fontDisplay}};
    font-size: 50px;
    line-height: 1.06;
    letter-spacing: -0.5px;
    margin-top: 6px;
  }
  .subhead {
    font-size: 20px;
    font-weight: 400;
    line-height: 1.3;
    color: rgba(255,255,255,0.82);
    margin-top: 8px;
  }
  .table-wrap {
    flex: 1;
    display: flex;
    align-items: center;
  }
  .data-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 22px;
  }
  .data-table thead th {
    font-family: {{fontBody}};
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    text-align: left;
    padding: 16px 22px;
    color: rgba(255,255,255,0.85);
    border-bottom: 2px solid rgba(255,255,255,0.20);
  }
  .data-table thead th.col-0 {
    color: rgba(255,255,255,0.6);
    width: 28%;
  }
  .data-table thead th.col-a {
    color: #c75c2c;
  }
  .data-table thead th.col-b {
    color: {{accentLight}};
    background: rgba(71,166,19,0.14);
    border-radius: 8px 8px 0 0;
  }
  .data-table tbody td {
    padding: 18px 22px;
    border-bottom: 1px solid rgba(255,255,255,0.10);
    vertical-align: middle;
    line-height: 1.3;
  }
  .data-table tbody td.col-0 {
    font-weight: 500;
    color: rgba(255,255,255,0.92);
    font-size: 20px;
  }
  .data-table tbody td.col-a {
    color: rgba(255,255,255,0.75);
    font-weight: 300;
  }
  .data-table tbody td.col-b {
    color: #fff;
    font-weight: 500;
    background: rgba(71,166,19,0.10);
    font-family: {{fontDisplay}};
    font-size: 26px;
  }
  .data-table tbody tr.emphasized td {
    background: rgba(71,166,19,0.20) !important;
    font-weight: 600;
  }
  .data-table tbody tr.emphasized td.col-a {
    color: rgba(255,255,255,0.85);
  }
  .data-table tbody tr.emphasized td.col-b {
    color: #fff;
  }
  .footnote-block {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .footnote-block .lead {
    font-family: {{fontDisplay}};
    font-style: italic;
    font-size: 24px;
    line-height: 1.25;
    color: #fff;
    background: rgba(71,166,19,0.18);
    border-left: 5px solid {{accent}};
    padding: 14px 22px;
  }
  .footnote-block .secondary {
    font-size: 14px;
    line-height: 1.4;
    color: rgba(255,255,255,0.62);
    max-width: 1300px;
  }
  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    color: rgba(255,255,255,0.62);
    letter-spacing: 1px;
    padding-top: 8px;
    border-top: 1px solid rgba(255,255,255,0.10);
  }
  .footer-row .logo {
    height: 44px;
    opacity: 0.95;
  }
  .footer-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .badge-provisorio {
    position: absolute;
    top: 18px;
    right: 24px;
    background: #c75c2c;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 4px;
    z-index: 5;
    display: {{provisorioDisplay}};
  }
</style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-symbol"></div>
  <div class="bg-pattern"></div>
  <div class="bg-vignette"></div>
  <div class="badge-provisorio">{{provisorioLabel}}</div>
  <div class="header">
    <div>
      <div class="eyebrow">{{eyebrow}}</div>
      <div class="title">{{title}}</div>
      <div class="subhead">{{subhead}}</div>
    </div>
    <div class="pageinfo">{{pageInfo}}</div>
  </div>
  <div class="table-wrap">
    <table class="data-table">
      <thead>
        <tr>{{tableHeadHtml}}</tr>
      </thead>
      <tbody>
        {{tableBodyHtml}}
      </tbody>
    </table>
  </div>
  <div class="footnote-block">
    <div class="lead">{{leadQuote}}</div>
    <div class="secondary">{{footnote}}</div>
  </div>
  <div class="footer-row">
    <div class="footer-left">
      <img class="logo" src="{{logoPath}}" alt="">
      <span>{{handle}}</span>
    </div>
    <div>{{footerRight}}</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{googleFontsLink}}
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: {{fontBody}};
    background-color: {{bgDeep}};
    color: #fff;
    position: relative;
    overflow: hidden;
  }

  /* Camada 1 — foto no topo (0 a 45% da altura) */
  .photo {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 45%;
    background-image: url("{{backgroundImage}}");
    background-size: cover;
    background-position: center;
    z-index: 0;
  }

  /* Camada 2 — gradient de transição (últimos 80px da foto escurecem) */
  .photo-fade {
    position: absolute;
    left: 0;
    right: 0;
    top: calc(45% - 80px);
    height: 80px;
    background: linear-gradient(180deg, rgba(2,67,27,0) 0%, rgba(2,67,27,0.7) 60%, {{bgDeep}} 100%);
    z-index: 1;
    pointer-events: none;
  }

  /* Container verde na parte inferior (45% a 100%) */
  .text-panel {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 55%;
    background-color: {{bgDeep}};
    padding: 56px 80px 120px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    z-index: 2;
    overflow: hidden;
  }

  /* Camadas enriquecidas dentro do text-panel */
  .panel-gradient {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 70% 60% at 15% 20%, rgba(71,166,19,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 60% 55% at 90% 95%, rgba(71,166,19,0.10) 0%, transparent 55%);
    z-index: 0;
    pointer-events: none;
  }
  .panel-symbol {
    position: absolute;
    right: -40px;
    top: -30px;
    width: 240px;
    height: 240px;
    background-image: url("{{logoSymbolPath}}");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0.22;
    z-index: 1;
    pointer-events: none;
    transform: rotate(15deg);
    filter: brightness(1.35);
  }
  .panel-pattern {
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 48 48'><path d='M24 4 L24 14 M24 34 L24 44 M4 24 L14 24 M34 24 L44 24' stroke='%2347a613' stroke-width='0.8' stroke-linecap='round' opacity='0.6'/><circle cx='24' cy='24' r='0.9' fill='%2347a613' opacity='0.5'/></svg>");
    background-size: 48px 48px;
    opacity: 0.10;
    z-index: 2;
    pointer-events: none;
  }

  /* Conteúdo acima das camadas */
  .eyebrow, .title, .body, .highlight, .footer {
    position: relative;
    z-index: 3;
  }
  .eyebrow {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: {{accentLight}};
  }
  .title {
    font-family: {{fontDisplay}};
    font-size: 54px;
    line-height: 1.05;
    letter-spacing: -0.5px;
    color: #fff;
  }
  .body {
    font-size: 28px;
    font-weight: 300;
    line-height: 1.35;
    color: rgba(255,255,255,0.92);
    max-width: 880px;
  }
  .body p + p { margin-top: 14px; }
  .body strong {
    color: {{accentLight}};
    font-weight: 500;
  }
  .highlight {
    font-family: {{fontDisplay}};
    font-size: 44px;
    line-height: 1.1;
    color: #fff;
    border-left: 6px solid {{accent}};
    padding-left: 22px;
    margin-top: 6px;
  }
  .footer {
    position: absolute;
    left: 80px;
    right: 80px;
    bottom: 50px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 4;
  }
  .handle {
    font-size: 18px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1px;
  }
  .page-num {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.7);
  }
  .logo {
    height: 60px;
    opacity: 0.95;
  }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="photo-fade"></div>
  <div class="text-panel">
    <div class="panel-gradient"></div>
    <div class="panel-symbol"></div>
    <div class="panel-pattern"></div>
    <div class="eyebrow">{{eyebrow}}</div>
    <div class="title">{{title}}</div>
    <div class="body">{{bodyHtml}}</div>
    <div class="highlight">{{highlight}}</div>
  </div>
  <div class="footer">
    <div class="handle">{{handle}}</div>
    <div class="page-num">{{pageNum}} / {{pageTotal}}</div>
    <img class="logo" src="{{logoPath}}" alt="">
  </div>
</body>
</html>

<!DOCTYPE html>
<!--
  Template: ad-single-centered (L1)
  Use: Anuncio single image remarketing — numero/texto grande centralizado
       + foto de pastagem no terco inferior + gradient scrim + logo
  Props:
    eyebrow         — rotulo pequeno acima do hero (ex: "PACOTE COMPLETO")
    hero            — numero ou frase grande em Bree Serif (ex: "R$ 8.180/ha")
    heroSub         — linha abaixo do hero (ex: "por 15 anos") — deixar vazio para ocultar
    strikethroughHtml — HTML RAW da lista riscada (Cost Stack) — deixar vazio para ocultar
    objection       — linha de objection handling
    proof           — linha de prova social — deixar vazio para ocultar
    handle          — @handle no rodape
  RAW fields: strikethroughHtml
  backgroundImage: path da foto no nivel root do job (nao em props)
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{googleFontsLink}}
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }

  body {
    font-family: {{fontBody}};
    background: {{bgDeep}};
    color: #ffffff;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }

  /* Foto de fundo (terco inferior, 32% da altura) */
  .photo-zone {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 32%;
    background-image: url("{{backgroundImage}}");
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
  }

  /* Gradient scrim sobre a foto — garante legibilidade do footer */
  .photo-zone::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      {{bgDeep}} 0%,
      rgba(2,67,27,0.65) 40%,
      rgba(2,67,27,0.38) 100%
    );
  }

  /* Zona de texto — ocupa 68% superior */
  .text-zone {
    position: relative;
    z-index: 2;
    height: 68%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 64px 72px 24px 72px;
  }

  /* Borda fina on-brand */
  .frame {
    position: absolute;
    inset: 36px;
    border: 1.5px solid rgba(255,255,255,0.18);
    pointer-events: none;
    z-index: 10;
  }

  /* Eyebrow */
  .eyebrow {
    font-family: {{fontBody}};
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: {{accentLight}};
    margin-bottom: 18px;
  }

  /* Lista riscada (Cost Stack) */
  .strikethrough-row {
    display: flex;
    flex-direction: row;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 18px;
  }
  .strikethrough-row span {
    font-family: {{fontBody}};
    font-size: 22px;
    font-weight: 400;
    color: rgba(255,255,255,0.55);
    text-decoration: line-through;
    text-decoration-color: rgba(71,166,19,0.8);
    text-decoration-thickness: 2px;
  }

  /* Hero number/text — Bree Serif grande */
  .hero {
    font-family: {{fontDisplay}};
    font-size: 152px;
    line-height: 1.0;
    letter-spacing: -3px;
    color: #ffffff;
    text-align: center;
    max-width: 100%;
    word-break: break-word;
  }

  .hero-sub {
    font-family: {{fontBody}};
    font-size: 38px;
    font-weight: 300;
    color: {{accentLight}};
    margin-top: 8px;
    letter-spacing: 1px;
  }

  /* Linha separadora */
  .divider {
    width: 60px;
    height: 2px;
    background: {{accent}};
    margin: 22px auto 18px auto;
    opacity: 0.7;
  }

  /* Objection handling */
  .objection {
    font-family: {{fontBody}};
    font-size: 28px;
    font-weight: 400;
    color: rgba(255,255,255,0.88);
    line-height: 1.35;
    max-width: 820px;
    text-align: center;
  }

  /* Prova social */
  .proof {
    font-family: {{fontBody}};
    font-size: 22px;
    font-weight: 600;
    color: {{accentLight}};
    margin-top: 14px;
    letter-spacing: 1px;
    text-align: center;
  }

  /* Footer */
  .footer {
    position: absolute;
    left: 60px;
    right: 60px;
    bottom: 52px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 5;
  }

  .handle {
    font-family: {{fontBody}};
    font-size: 19px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.7);
  }

  .logo {
    height: 64px;
    width: auto;
    object-fit: contain;
    opacity: 0.95;
  }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="photo-zone"></div>

  <div class="text-zone">
    <div class="eyebrow">{{eyebrow}}</div>
    {{strikethroughHtml}}
    <div class="hero">{{hero}}</div>
    <div class="hero-sub">{{heroSub}}</div>
    <div class="divider"></div>
    <div class="objection">{{objection}}</div>
    <div class="proof">{{proof}}</div>
  </div>

  <div class="footer">
    <div class="handle">{{handle}}</div>
    <img class="logo" src="{{logoPath}}" alt="">
  </div>
</body>
</html>

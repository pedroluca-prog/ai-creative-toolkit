<!DOCTYPE html>
<!--
  deck-capa-16-9 (1920x1080)
  Slide de capa de deck. Foto full-bleed com scrim + bloco de texto na parte inferior esquerda.
  Props:
    - eyebrow: linha pequena uppercase no topo (ex: "REUNIÃO PERSONALIZADA")
    - headline: título Bree Serif grande
    - subhead: subtítulo Poppins
    - dataLine: linha de dados editáveis ({NOME_PRODUTOR} · {HECTARES_ALVO} ha · {ESTADO} · {DATA_REUNIAO}) — campos com fundo creme/borda amarela CSS embutido
    - handle: rodapé direito (xirumudas.com.br · @xirumudas.tifton)
    - backgroundImage: foto de fundo (obrigatório pra capa)
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{googleFontsLink}}
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: {{fontBody}};
    background: {{bgDeep}};
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .bg {
    position: absolute;
    inset: 0;
    background-color: {{bgDark}};
    background-image: url("{{backgroundImage}}");
    background-size: cover;
    background-position: center;
    z-index: 0;
  }
  .bg-fallback-pattern {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(71,166,19,0.25) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(71,166,19,0.18) 0%, transparent 40%);
    pointer-events: none;
    z-index: 1;
  }
  .scrim {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(2,67,27,0.85) 0%, rgba(2,67,27,0.55) 45%, rgba(2,67,27,0.20) 100%),
      linear-gradient(180deg, rgba(2,67,27,0.45) 0%, rgba(2,67,27,0.45) 60%, rgba(2,67,27,0.85) 100%);
    z-index: 2;
  }
  .header {
    position: absolute;
    top: 50px;
    left: 70px;
    right: 70px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 4;
  }
  .logo {
    height: 90px;
    opacity: 0.96;
  }
  .header-right {
    text-align: right;
    font-size: 16px;
    color: rgba(255,255,255,0.78);
    line-height: 1.5;
  }
  .band {
    position: absolute;
    left: 80px;
    bottom: 90px;
    right: 80px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    z-index: 4;
    max-width: 1400px;
  }
  .eyebrow {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: {{accentLight}};
  }
  .headline {
    font-family: {{fontDisplay}};
    font-size: 96px;
    line-height: 1.02;
    letter-spacing: -1px;
    max-width: 1200px;
    color: #fff;
  }
  .subhead {
    font-size: 28px;
    font-weight: 400;
    line-height: 1.3;
    color: rgba(255,255,255,0.92);
    max-width: 1100px;
  }
  .dataLine {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
  }
  .field-edit {
    display: inline-block;
    font-family: {{fontBody}};
    font-size: 22px;
    font-weight: 500;
    color: #1B1F14;
    background: #FFF8DC;
    border: 2px dashed {{amber}};
    padding: 10px 18px;
    border-radius: 8px;
    letter-spacing: 0.2px;
  }
  .field-sep {
    color: rgba(255,255,255,0.65);
    font-size: 22px;
  }
  .footer {
    position: absolute;
    left: 80px;
    right: 80px;
    bottom: 36px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 4;
    font-size: 16px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="bg-fallback-pattern"></div>
  <div class="scrim"></div>
  <div class="header">
    <img class="logo" src="{{logoPath}}" alt="">
    <div class="header-right">{{headerRight}}</div>
  </div>
  <div class="band">
    <div class="eyebrow">{{eyebrow}}</div>
    <div class="headline">{{headline}}</div>
    <div class="subhead">{{subhead}}</div>
    <div class="dataLine">
      <span class="field-edit">{{nomeProdutor}}</span>
      <span class="field-sep">·</span>
      <span class="field-edit">{{hectaresAlvo}} ha</span>
      <span class="field-sep">·</span>
      <span class="field-edit">{{estado}}</span>
      <span class="field-sep">·</span>
      <span class="field-edit">{{dataReuniao}}</span>
    </div>
  </div>
  <div class="footer">
    <div>{{handle}}</div>
    <div>{{provisorio}}</div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{googleFontsLink}}
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: {{fontBody}};
    background: {{bgDeep}};
    color: #fff;
    padding: 100px 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 30px;
    position: relative;
  }
  .mark {
    font-family: {{fontDisplay}};
    font-size: 180px;
    line-height: 0.8;
    color: {{accentLight}};
    opacity: 0.5;
    margin-bottom: -30px;
  }
  .quote {
    font-family: {{fontDisplay}};
    font-size: 60px;
    line-height: 1.15;
    letter-spacing: -0.5px;
    max-width: 900px;
  }
  .attribution {
    font-size: 24px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: {{accentLight}};
    font-weight: 600;
    margin-top: 20px;
  }
  .role {
    font-size: 20px;
    color: rgba(255,255,255,0.7);
    font-weight: 300;
    letter-spacing: 1px;
  }
  .footer {
    position: absolute;
    left: 80px;
    right: 80px;
    bottom: 60px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .handle { font-size: 20px; color: rgba(255,255,255,0.7); letter-spacing: 1px; }
  .logo { height: 60px; opacity: 0.95; }
</style>
</head>
<body>
  <div class="mark">"</div>
  <div class="quote">{{quote}}</div>
  <div>
    <div class="attribution">{{attribution}}</div>
    <div class="role">{{role}}</div>
  </div>
  <div class="footer">
    <div class="handle">{{handle}}</div>
    <img class="logo" src="{{logoPath}}" alt="">
  </div>
</body>
</html>
